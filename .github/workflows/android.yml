
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Restore packages
        run: dotnet restore MobileI2VConsole.sln

      - name: Build APK
        run: dotnet publish src/MobileI2VConsole/MobileI2VConsole.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2VConsole-apk
          path: src/MobileI2VConsole/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 7
          
